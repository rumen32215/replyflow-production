<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ReplyFlow — First Morning (Full Journey, Design Preview)</title>
<style>
  /* ============== DIRECTION A — minimal (default) ============== */
  :root {
    --bg:#f2f5f8; --surface:#ffffff; --surface-2:#eef2f6; --line:#c7d0da;
    --border:#dde4ea; --text:#10151b; --text-dim:#5b6672; --text-faint:#97a2ad;
    --blue:#2563eb; --green:#16a34a; --gradient:linear-gradient(135deg,var(--blue),var(--green));
    --shadow:0 1px 2px rgba(16,21,27,.05),0 20px 44px -16px rgba(16,21,27,.18);
    --obj-radius:8px; --room-radius:26px;
    --nameplate-font: ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif;
    --nameplate-weight: 800;
    --surface-tex: none;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root{ --bg:#0a0e13; --surface:#131a22; --surface-2:#182029; --line:#37424f; --border:#232d38; --text:#eef2f6; --text-dim:#93a0ae; --text-faint:#586675; color-scheme: dark; }
  }

  /* ============== DIRECTION B — warmer / tangible ============== */
  :root[data-direction="b"]{
    --bg:#f4ede0; --surface:#fffbf4; --surface-2:#ece0c9; --line:#d9c7a3;
    --border:#e2d3b3; --text:#241d13; --text-dim:#6b5c44; --text-faint:#a3907036;
    --text-faint:#a3906f;
    --blue:#2563eb; --green:#16a34a; --gradient:linear-gradient(135deg,#3b6fe0,#2f9e57);
    --shadow:0 2px 5px rgba(64,42,12,.10),0 26px 50px -16px rgba(64,42,12,.30);
    --obj-radius:13px; --room-radius:22px;
    --nameplate-font: ui-serif,Georgia,"Times New Roman",serif;
    --nameplate-weight: 700;
    --surface-tex: linear-gradient(160deg, rgba(255,255,255,.5), transparent 40%);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-direction="b"]{ --bg:#161009; --surface:#241c12; --surface-2:#2e2417; --line:#4a3c26; --border:#392e1c; --text:#f3ead9; --text-dim:#c2ac89; --text-faint:#7c6b4e; --shadow:0 2px 5px rgba(0,0,0,.3),0 26px 50px -16px rgba(0,0,0,.6); }
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:32px; transition:background .3s ease, color .3s ease;
  }

  .page{ width:100%; max-width:640px; }

  .version-label{
    position:fixed; top:14px; right:16px; font-size:10.5px; font-weight:700;
    letter-spacing:.06em; color:var(--text-faint); background:var(--surface);
    border:1px solid var(--border); border-radius:99px; padding:4px 10px;
    z-index:10; pointer-events:none;
  }

  @media (max-width:480px){
    body{ padding:20px 14px; }
    .version-label{ top:10px; right:10px; font-size:9.5px; padding:3px 8px; }
    .trade-btn{ width:48px; height:48px; }
    #nameInput{ font-size:22px; }
    .kicker{ font-size:10.5px; margin-bottom:16px; }
    .toggle-row{ margin-bottom:16px; }
  }

  /* ---------- Direction toggle ---------- */
  .toggle-row{ display:flex; justify-content:center; margin-bottom:20px; }
  .toggle{
    display:inline-flex; background:var(--surface-2); border:1px solid var(--border);
    border-radius:99px; padding:3px; gap:2px;
  }
  .toggle button{
    border:none; background:transparent; padding:6px 14px; border-radius:99px;
    font-size:12px; font-weight:700; color:var(--text-faint); cursor:pointer; font-family:inherit;
    transition:background .2s, color .2s;
  }
  .toggle button.active{ background:var(--surface); color:var(--text); box-shadow:var(--shadow); }

  .kicker{
    text-align:center; font-size:11.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
    color:var(--text-faint); margin-bottom:20px;
  }

  /* ---------- Control strip (one at a time, never stacked) ---------- */
  #control{ text-align:center; min-height:76px; margin-bottom:18px; }
  .ctrl-panel{ transition:opacity .35s ease, transform .35s ease; }
  .ctrl-panel.leaving{ opacity:0; transform:translateY(-6px); }
  #nameInput, .time-input, .chip-input, .knowledge-input{
    background:transparent; border:none; border-bottom:1.5px solid var(--line);
    font-size:21px; font-weight:700; letter-spacing:-0.01em; color:var(--text);
    padding:8px 4px 12px; outline:none; font-family:inherit; text-align:center;
  }
  #nameInput{ width:100%; max-width:420px; font-size:26px; }
  #nameInput:focus, .time-input:focus, .chip-input:focus, .knowledge-input:focus{ border-color:var(--blue); }
  .hint{ margin-top:12px; font-size:12px; color:var(--text-faint); }
  .hint kbd{ font-family:ui-monospace,monospace; background:var(--surface-2); border:1px solid var(--border); border-radius:5px; padding:1.5px 6px; font-size:10.5px; }

  .trade-grid{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .trade-btn{
    width:58px; height:58px; border-radius:var(--obj-radius); border:1.5px solid var(--border);
    background:var(--surface); cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:border-color .2s, transform .15s;
  }
  .trade-btn:hover{ transform:translateY(-2px); border-color:var(--text-faint); }
  .trade-btn.picked{ border-color:var(--blue); box-shadow:0 0 0 3px rgba(37,99,235,.14); }
  .trade-icon{ width:22px; height:22px; }

  .chip-input-row{ display:flex; flex-direction:column; align-items:center; gap:10px; }
  .chips{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; max-width:320px; }
  .chip{ font-size:12px; font-weight:650; padding:4px 10px; border-radius:99px; background:var(--surface-2); color:var(--text-dim); border:1px solid var(--border); }

  .time-row{ display:flex; gap:14px; align-items:center; justify-content:center; }
  .time-input{ width:110px; font-size:19px; }

  .go-btn{
    margin-top:14px; padding:9px 22px; border-radius:99px; background:var(--gradient);
    color:#fff; border:none; font-size:13.5px; font-weight:700; cursor:pointer; font-family:inherit;
    opacity:0; pointer-events:none; transition:opacity .3s ease;
  }
  .go-btn.show{ opacity:1; pointer-events:auto; }

  .connect-btn{
    padding:11px 26px; border-radius:99px; background:var(--gradient); color:#fff; border:none;
    font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;
  }

  .done-label{ font-size:13px; color:var(--text-faint); }

  /* ---------- Room ---------- */
  #room{
    position:relative; width:100%; aspect-ratio:16/11; background:var(--surface);
    border:1px solid var(--border); border-radius:var(--room-radius); box-shadow:var(--shadow);
    opacity:0; transform:scale(.97); transition:opacity .6s ease, transform .6s ease, border-radius .3s, background .3s;
    overflow:hidden;
  }
  #room.active{ opacity:1; transform:scale(1); }
  #room::before{ content:""; position:absolute; inset:0; background:var(--surface-tex); pointer-events:none; }

  .room-inner{ position:absolute; inset:7%; }

  /* Wall panel (Coverage) */
  .wallpanel{
    position:absolute; top:0; left:16%; right:16%; height:30%;
    border:1.5px dashed var(--line); border-radius:var(--obj-radius); background:transparent;
    transition:background .5s ease, border-color .5s ease, border-radius .3s;
    overflow:hidden;
  }
  .wallpanel.wake{ border:1px solid var(--border); background:var(--surface-2); }
  .boundary{
    position:absolute; top:50%; left:50%; width:0; height:0; border-radius:50%;
    background:radial-gradient(circle, rgba(37,99,235,.16), rgba(22,163,74,.08) 65%, transparent 78%);
    transform:translate(-50%,-50%); transition:width .5s cubic-bezier(.22,1,.36,1), height .5s cubic-bezier(.22,1,.36,1);
  }
  .pin{
    position:absolute; width:8px; height:8px; border-radius:50%;
    background:var(--blue); opacity:0; transform:translate(-50%,-140%) scale(.4);
    box-shadow:0 0 0 4px rgba(37,99,235,.14);
  }
  .wallpanel.wake .pin.on{
    transition:opacity .25s ease, transform .5s cubic-bezier(.34,1.56,.64,1);
    opacity:1; transform:translate(-50%,-50%) scale(1);
  }
  .pin.fading{ transition:opacity .3s ease; opacity:0 !important; }

  /* Desk */
  .desk{ position:absolute; left:0; right:0; bottom:0; height:52%; }

  /* Tool (Trade) */
  .tool{
    position:absolute; bottom:14%; left:9%; width:15%; height:24px;
    opacity:0; transform:translateY(6px) scale(1);
    transition:opacity .45s ease, transform .3s cubic-bezier(.22,1,.36,1);
  }
  .tool-shape{ position:absolute; inset:0; }
  .tool.wake{ opacity:1; transform:translateY(0) scale(1); }
  .tool.repersonalize{ animation: toolSwap 380ms ease; }
  @keyframes toolSwap{ 0%{transform:translateY(0) scale(1);} 40%{transform:translateY(0) scale(.82); opacity:.4;} 100%{transform:translateY(0) scale(1); opacity:1;} }
  /* generic */
  .tool[data-trade=""] .tool-shape::before, .tool[data-trade=""] .tool-shape::after{ content:""; position:absolute; background:var(--text-faint); border-radius:3px; }
  .tool[data-trade=""] .tool-shape::before{ width:100%; height:6px; top:9px; transform:rotate(-18deg); }
  .tool[data-trade=""] .tool-shape::after{ width:9px; height:9px; border-radius:50%; left:2px; top:7px; background:var(--surface); border:2px solid var(--text-faint); }
  .tool.wake[data-trade=""] .tool-shape::before, .tool.wake[data-trade=""] .tool-shape::after{ background:var(--blue); border-color:var(--blue); }
  /* plumbing: wrench (same as generic, coloured) */
  .tool[data-trade="plumbing"] .tool-shape::before{ content:""; position:absolute; width:100%; height:6px; top:9px; transform:rotate(-18deg); background:var(--blue); border-radius:3px; }
  .tool[data-trade="plumbing"] .tool-shape::after{ content:""; position:absolute; width:10px; height:10px; border-radius:50%; left:1px; top:6px; background:var(--surface); border:2px solid var(--blue); }
  /* electrical: bolt */
  .tool[data-trade="electrical"] .tool-shape::before{ content:""; position:absolute; width:11px; height:22px; left:5px; top:0; background:var(--blue); clip-path:polygon(60% 0,0 55%,45% 55%,35% 100%,100% 40%,55% 40%); }
  /* painting: roller */
  .tool[data-trade="painting"] .tool-shape::before{ content:""; position:absolute; width:70%; height:9px; left:0; top:8px; background:var(--green); border-radius:4px; }
  .tool[data-trade="painting"] .tool-shape::after{ content:""; position:absolute; width:2px; height:16px; right:8px; top:2px; background:var(--text-faint); }
  /* building: hammer */
  .tool[data-trade="building"] .tool-shape::before{ content:""; position:absolute; width:3px; height:22px; left:8px; top:2px; background:var(--text-faint); border-radius:2px; }
  .tool[data-trade="building"] .tool-shape::after{ content:""; position:absolute; width:16px; height:8px; left:2px; top:0; background:var(--blue); border-radius:3px; }
  /* roofing: tile */
  .tool[data-trade="roofing"] .tool-shape::before{ content:""; position:absolute; width:20px; height:16px; left:2px; top:4px; background:var(--blue); clip-path:polygon(50% 0,100% 100%,0 100%); }

  /* Notebook (Knowledge) */
  .notebook{
    position:absolute; bottom:13%; left:29%; width:19%; height:15%;
    border:1.5px dashed var(--line); border-radius:calc(var(--obj-radius) * .4) var(--obj-radius) var(--obj-radius) calc(var(--obj-radius) * .4);
    background:transparent; transform-origin:left center; transition:background .35s ease, border-color .35s ease;
  }
  .notebook .page{ position:absolute; inset:2px; background:var(--surface); border-radius:inherit; transform:scaleX(0); transform-origin:left; opacity:0; }
  .notebook .mark{ position:absolute; top:30%; left:14%; width:0%; height:2.5px; background:var(--blue); border-radius:2px; }
  .notebook .mark2{ position:absolute; top:58%; left:14%; width:0%; height:2.5px; background:var(--green); border-radius:2px; }
  .notebook.wake{ border:1px solid var(--border); }
  .notebook.write-1 .page{ animation: bookOpen 700ms cubic-bezier(.4,0,.2,1) forwards; }
  .notebook.write-1 .mark{ animation: bookWrite 700ms ease forwards; animation-delay:220ms; }
  .notebook.write-2 .page{ animation: bookOpen2 700ms cubic-bezier(.4,0,.2,1) forwards; }
  .notebook.write-2 .mark2{ animation: bookWrite2 700ms ease forwards; animation-delay:220ms; }
  @keyframes bookOpen{ 0%{transform:scaleX(0);opacity:0;} 35%{transform:scaleX(1);opacity:1;} 75%{transform:scaleX(1);opacity:1;} 100%{transform:scaleX(.05);opacity:.4;} }
  @keyframes bookWrite{ 0%{width:0%;} 55%{width:72%;} 100%{width:72%;} }
  @keyframes bookOpen2{ 0%{transform:scaleX(.05);opacity:.4;} 35%{transform:scaleX(1);opacity:1;} 75%{transform:scaleX(1);opacity:1;} 100%{transform:scaleX(.05);opacity:.4;} }
  @keyframes bookWrite2{ 0%{width:0%;} 55%{width:58%;} 100%{width:58%;} }

  /* Clock (Availability) */
  .clock{
    position:absolute; bottom:16%; right:26%; width:15%; aspect-ratio:1;
    border:1.5px dashed var(--line); border-radius:50%; background:transparent;
    transition:background .4s ease, border-color .4s ease;
  }
  .clock .arc{ position:absolute; inset:0; border-radius:50%; opacity:0; transition:opacity .5s ease; background:conic-gradient(from calc(var(--open-angle,0deg) - 90deg), rgba(22,163,74,.20) 0deg, rgba(22,163,74,.20) var(--span,0deg), transparent var(--span,0deg)); }
  .clock.hours-set .arc{ opacity:1; }
  .clock .hand{ position:absolute; top:50%; left:50%; width:2px; height:32%; background:var(--text-faint); transform-origin:bottom center; transform:translate(-50%,-100%) rotate(0deg); }
  .clock.wake{ border:1px solid var(--border); background:var(--surface-2); }
  .clock.wake .hand{ background:var(--blue); animation: tick 1s steps(1) infinite; }
  @keyframes tick{ 0%{transform:translate(-50%,-100%) rotate(0deg);} 16.6%{transform:translate(-50%,-100%) rotate(60deg);} 33.3%{transform:translate(-50%,-100%) rotate(120deg);} 50%{transform:translate(-50%,-100%) rotate(180deg);} 66.6%{transform:translate(-50%,-100%) rotate(240deg);} 83.3%{transform:translate(-50%,-100%) rotate(300deg);} 100%{transform:translate(-50%,-100%) rotate(360deg);} }

  /* Phone (Communication) */
  .phone{
    position:absolute; bottom:13%; right:7%; width:11%; height:26%;
    border:1.5px dashed var(--line); border-radius:calc(var(--obj-radius)*.7); background:transparent;
    transition:background .4s ease, border-color .4s ease;
  }
  .phone .glow{ position:absolute; inset:14%; border-radius:3px; background:var(--surface); opacity:0; }
  .phone .dot{ position:absolute; top:10%; right:10%; width:6px; height:6px; border-radius:50%; background:var(--green); opacity:0; transform:scale(0); transition:opacity .3s, transform .35s cubic-bezier(.34,1.56,.64,1); }
  .phone.wake{ border:1px solid var(--border); background:var(--surface-2); }
  .phone.wake .glow{ animation: phoneWake 550ms ease forwards; }
  @keyframes phoneWake{ 0%{opacity:0;background:var(--surface);} 40%{opacity:1;background:var(--gradient);box-shadow:0 0 14px 2px rgba(37,99,235,.35);} 100%{opacity:.9;background:var(--surface-2);box-shadow:none;} }
  .phone.breathing .glow{ animation: breathe 3.2s ease-in-out infinite; }
  @keyframes breathe{ 0%,100%{opacity:.35;background:var(--surface-2);box-shadow:0 0 0 0 rgba(37,99,235,0);} 50%{opacity:1;background:var(--gradient);box-shadow:0 0 10px 1px rgba(37,99,235,.25);} }
  .phone.connected .dot{ opacity:1; transform:scale(1); }
  .phone.connected .glow{ animation: breatheGreen 2.6s ease-in-out infinite; }
  @keyframes breatheGreen{ 0%,100%{opacity:.4;background:var(--surface-2);box-shadow:0 0 0 0 rgba(22,163,74,0);} 50%{opacity:1;background:linear-gradient(135deg,var(--green),var(--blue));box-shadow:0 0 10px 1px rgba(22,163,74,.3);} }

  /* Nameplate (Identity) */
  .nameplate{
    position:absolute; bottom:-1%; left:50%; width:46%; height:15%;
    transform:translate(-50%,0) scaleY(1); border:1.5px dashed var(--line); border-radius:calc(var(--obj-radius)*.9);
    background:transparent; display:flex; align-items:center; justify-content:center;
    transition:background .3s ease, border-color .3s ease;
  }
  .nameplate span{
    font-family:var(--nameplate-font); font-weight:var(--nameplate-weight);
    font-size:11px; letter-spacing:.03em; color:#fff; opacity:0;
    transition:opacity .3s ease; text-align:center; padding:0 6px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;
  }
  .nameplate.wake{ animation: stamp 420ms cubic-bezier(.34,1.56,.64,1) forwards; border:none; background:var(--gradient); }
  .nameplate.wake span{ opacity:1; transition-delay:.15s; }
  @keyframes stamp{ 0%{transform:translate(-50%,0) scaleY(1);} 35%{transform:translate(-50%,0) scaleY(.72);} 70%{transform:translate(-50%,0) scaleY(1.06);} 100%{transform:translate(-50%,0) scaleY(1);} }

  .end-note{ text-align:center; margin-top:18px; font-size:12.5px; color:var(--text-faint); opacity:0; transition:opacity .6s ease; }
  .end-note.show{ opacity:1; }
  .start-over{
    display:block; margin:12px auto 0; padding:8px 18px; border-radius:99px;
    background:var(--surface); border:1px solid var(--border); color:var(--text-dim);
    font-size:12.5px; font-weight:650; cursor:pointer; font-family:inherit;
    opacity:0; pointer-events:none; transition:opacity .4s ease, color .2s, border-color .2s;
  }
  .start-over:hover{ color:var(--text); border-color:var(--text-faint); }
  .start-over.show{ opacity:1; pointer-events:auto; }
</style>
</head>
<body>

<div class="version-label">Design Preview V1</div>

<div class="page">
  <div class="toggle-row">
    <div class="toggle">
      <button id="dirA" class="active">Minimal</button>
      <button id="dirB">Tangible</button>
    </div>
  </div>
  <div class="kicker">ReplyFlow — full journey, design preview</div>

  <div id="control">
    <div class="ctrl-panel" id="panel-name">
      <input id="nameInput" placeholder="Type a business name" autofocus maxlength="40" />
      <div class="hint">Press <kbd>Enter</kbd></div>
    </div>
  </div>

  <div id="room">
    <div class="room-inner">
      <div class="wallpanel" id="wallpanel"><div class="boundary" id="boundary"></div></div>
      <div class="desk">
        <div class="tool" id="tool" data-trade=""><div class="tool-shape"></div></div>
        <div class="notebook" id="notebook"><div class="page"></div><div class="mark"></div><div class="mark2"></div></div>
        <div class="clock" id="clock"><div class="arc" id="clockArc"></div><div class="hand"></div></div>
        <div class="phone" id="phone"><div class="glow"></div><div class="dot"></div></div>
        <div class="nameplate" id="nameplate"><span id="nameplateText"></span></div>
      </div>
    </div>
  </div>

  <div class="end-note" id="endNote">This is the workstation now. Nothing else to fill in — it's simply ready.</div>
  <button class="start-over" id="startOver">Start over</button>
</div>

<script>
  const $ = (id) => document.getElementById(id);

  // ---------- Direction toggle (non-destructive, re-skins live state) ----------
  $('dirA').addEventListener('click', () => setDirection('a'));
  $('dirB').addEventListener('click', () => setDirection('b'));
  function setDirection(d){
    document.documentElement.setAttribute('data-direction', d);
    $('dirA').classList.toggle('active', d === 'a');
    $('dirB').classList.toggle('active', d === 'b');
  }

  // ---------- Journey state ----------
  const room = $('room');
  const control = $('control');
  let pinCount = 0;

  // `after` runs once the new HTML is actually in the DOM — swapping is
  // asynchronous whenever a previous panel has to fade out first, so
  // anything that queries or focuses the new controls has to wait for
  // that, not run synchronously right after this call.
  function swapControl(html, after) {
    const current = control.firstElementChild;
    if (current) {
      current.classList.add('leaving');
      setTimeout(() => { control.innerHTML = html; if (after) after(); }, 220);
    } else {
      control.innerHTML = html;
      if (after) after();
    }
  }

  // ===== Step 0: Name -> wakes the whole workstation =====
  $('nameInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.value.trim().length > 0) wakeWorkstation(e.target.value.trim());
  });

  function wakeWorkstation(name) {
    swapControl('');
    room.classList.add('active');
    $('nameplateText').textContent = name;
    const beats = [
      [$('nameplate'), 150],
      [$('clock'), 650],
      [() => $('notebook').classList.add('wake','write-1'), 1050],
      [() => { $('wallpanel').classList.add('wake'); dropPin(50,50,true); }, 1700],
      [$('tool'), 2050],
      [$('phone'), 2400],
    ];
    beats.forEach(([el, delay]) => setTimeout(() => { if (typeof el === 'function') el(); else el.classList.add('wake'); }, delay));
    setTimeout(() => { $('phone').classList.add('breathing'); showTradeStep(); }, 3200);
  }

  function dropPin(xPct, yPct, isGeneric){
    const pin = document.createElement('div');
    pin.className = 'pin on' + (isGeneric ? ' generic' : '');
    pin.style.left = xPct + '%';
    pin.style.top = yPct + '%';
    $('wallpanel').appendChild(pin);
    return pin;
  }

  // ===== Step 1: Trade -> personalises the tool =====
  function showTradeStep(){
    swapControl(`
      <div class="ctrl-panel" id="panel-trade">
        <div class="trade-grid">
          ${tradeBtn('plumbing','Plumbing')}
          ${tradeBtn('electrical','Electrical')}
          ${tradeBtn('painting','Painting')}
          ${tradeBtn('building','Building')}
          ${tradeBtn('roofing','Roofing')}
        </div>
      </div>`, () => {
      document.querySelectorAll('.trade-btn').forEach(b => b.addEventListener('click', () => pickTrade(b)));
    });
  }
  function tradeBtn(key, label){
    return `<button class="trade-btn" data-trade="${key}" title="${label}"><span class="trade-icon" style="display:block;width:100%;height:100%;position:relative;">${tradeGlyph(key)}</span></button>`;
  }
  function tradeGlyph(key){
    const c = 'var(--blue)';
    if (key==='plumbing') return `<div style="position:absolute;width:100%;height:6px;top:8px;transform:rotate(-18deg);background:${c};border-radius:3px;"></div><div style="position:absolute;width:10px;height:10px;border-radius:50%;left:0;top:5px;background:var(--surface);border:2px solid ${c};"></div>`;
    if (key==='electrical') return `<div style="position:absolute;width:12px;height:22px;left:5px;top:0;background:${c};clip-path:polygon(60% 0,0 55%,45% 55%,35% 100%,100% 40%,55% 40%);"></div>`;
    if (key==='painting') return `<div style="position:absolute;width:70%;height:9px;left:0;top:7px;background:var(--green);border-radius:4px;"></div><div style="position:absolute;width:2px;height:16px;right:6px;top:1px;background:var(--text-faint);"></div>`;
    if (key==='building') return `<div style="position:absolute;width:3px;height:22px;left:9px;top:0;background:var(--text-faint);border-radius:2px;"></div><div style="position:absolute;width:16px;height:8px;left:3px;top:-2px;background:${c};border-radius:3px;"></div>`;
    if (key==='roofing') return `<div style="position:absolute;width:20px;height:16px;left:1px;top:3px;background:${c};clip-path:polygon(50% 0,100% 100%,0 100%);"></div>`;
    return '';
  }
  function pickTrade(btn){
    document.querySelectorAll('.trade-btn').forEach(b => b.classList.remove('picked'));
    btn.classList.add('picked');
    const key = btn.dataset.trade;
    const tool = $('tool');
    tool.classList.add('repersonalize');
    setTimeout(() => { tool.setAttribute('data-trade', key); }, 160);
    setTimeout(showAreaStep, 650);
  }

  // ===== Step 2: Coverage -> real pins replace the generic one =====
  let areas = [];
  function showAreaStep(){
    swapControl(`
      <div class="ctrl-panel" id="panel-area">
        <div class="chip-input-row">
          <input class="chip-input" id="areaInput" placeholder="Add a town or area" maxlength="24" />
          <div class="chips" id="chipList"></div>
          <button class="go-btn" id="areaGo">That's everywhere</button>
        </div>
      </div>`, () => {
      const genericPin = document.querySelector('.pin.generic');
      const input = $('areaInput');
      input.focus();
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && input.value.trim()) {
          addArea(input.value.trim(), genericPin);
          input.value = '';
        }
      });
      $('areaGo').addEventListener('click', showHoursStep);
    });
  }
  function addArea(name, genericPin){
    areas.push(name);
    if (genericPin && !genericPin.dataset.faded) {
      genericPin.classList.add('fading');
      genericPin.dataset.faded = '1';
    }
    const angle = (pinCount * 67) % 360;
    const r = 18 + pinCount * 4;
    const x = 50 + Math.cos(angle * Math.PI/180) * r * 0.6;
    const y = 50 + Math.sin(angle * Math.PI/180) * r * 0.35;
    dropPin(Math.max(10,Math.min(90,x)), Math.max(10,Math.min(90,y)), false);
    pinCount++;
    const size = Math.min(220, 90 + pinCount * 40);
    $('boundary').style.width = size + 'px';
    $('boundary').style.height = size + 'px';
    const chip = document.createElement('span');
    chip.className = 'chip'; chip.textContent = name;
    $('chipList').appendChild(chip);
    $('areaGo').classList.add('show');
  }

  // ===== Step 3: Hours -> clock gains a real open/close arc =====
  function showHoursStep(){
    swapControl(`
      <div class="ctrl-panel" id="panel-hours">
        <div class="time-row">
          <input type="time" class="time-input" id="openTime" value="08:00" />
          <span style="color:var(--text-faint);">–</span>
          <input type="time" class="time-input" id="closeTime" value="17:30" />
        </div>
        <button class="go-btn show" id="hoursGo">That's right</button>
      </div>`, () => {
      $('hoursGo').addEventListener('click', () => {
        const open = $('openTime').value || '08:00';
        const close = $('closeTime').value || '17:30';
        setClockArc(open, close);
        showKnowledgeStep();
      });
    });
  }
  function setClockArc(open, close){
    const toAngle = (t) => { const [h,m] = t.split(':').map(Number); return ((h % 12) + m/60) / 12 * 360; };
    const start = toAngle(open);
    let span = toAngle(close) - start;
    if (span <= 0) span += 360;
    $('clock').style.setProperty('--open-angle', start + 'deg');
    $('clock').style.setProperty('--span', Math.min(span,340) + 'deg');
    $('clock').classList.add('hours-set');
  }

  // ===== Step 4: Knowledge -> notebook gains a second line =====
  function showKnowledgeStep(){
    swapControl(`
      <div class="ctrl-panel" id="panel-knowledge">
        <input class="knowledge-input" id="knowledgeInput" placeholder="Teach it one thing" maxlength="60" />
        <div class="hint">Press <kbd>Enter</kbd></div>
      </div>`, () => {
      const input = $('knowledgeInput');
      input.focus();
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && input.value.trim()) {
          $('notebook').classList.add('write-2');
          setTimeout(showCommunicationStep, 750);
        }
      });
    });
  }

  // ===== Step 5: Communication -> phone goes from alive to connected =====
  function showCommunicationStep(){
    swapControl(`
      <div class="ctrl-panel" id="panel-comm">
        <button class="connect-btn" id="connectBtn">Connect WhatsApp</button>
      </div>`, () => {
      $('connectBtn').addEventListener('click', () => {
        $('phone').classList.add('connected');
        swapControl('');
        setTimeout(() => {
          $('endNote').classList.add('show');
          $('startOver').classList.add('show');
        }, 300);
      });
    });
  }

  $('startOver').addEventListener('click', () => location.reload());
</script>

</body>
</html>
