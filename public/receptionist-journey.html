<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ReplyFlow — Receptionist Journey (Experience Prototype)</title>
<style>
  :root{
    --background:#F8FAFC;
    --card:#FFFFFF;
    --foreground:#0F172A;
    --muted:#64748B;
    --muted-soft:#94A3B8;
    --border:#E2E8F0;
    --primary:#2563EB;
    --success:#22C55E;
    --radius:20px;
    --radius-sm:12px;
    --ease:cubic-bezier(.22,1,.36,1);
    --shadow-elevated:0 20px 45px -20px rgba(15,23,42,.18), 0 2px 8px -2px rgba(15,23,42,.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--background);
    color:var(--foreground);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    overflow-x:hidden;
  }

  .version-label{
    position:fixed;top:10px;left:50%;transform:translateX(-50%);
    font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--muted-soft);
    background:rgba(255,255,255,.85);backdrop-filter:blur(6px);
    padding:5px 12px;border-radius:999px;border:1px solid var(--border);
    z-index:500;pointer-events:none;
  }

  .start-over{
    position:fixed;top:10px;right:14px;z-index:500;
    font-size:12px;font-weight:600;color:var(--muted);
    background:var(--card);border:1px solid var(--border);border-radius:999px;
    padding:7px 14px;cursor:pointer;
    opacity:0;pointer-events:none;transition:opacity .3s var(--ease);
  }
  .start-over.visible{opacity:1;pointer-events:auto;}
  .start-over:hover{border-color:var(--muted-soft);}

  .stage{
    max-width:560px;margin:0 auto;padding:64px 20px 80px;
    position:relative;
  }

  /* ---------- Threshold ---------- */
  .threshold{
    min-height:82vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:22px;
  }
  .threshold h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0;max-width:340px;line-height:1.3;}
  .cta{
    appearance:none;border:none;cursor:pointer;
    background:var(--primary);color:#fff;font-weight:700;font-size:15px;
    padding:15px 26px;border-radius:999px;box-shadow:0 10px 30px -8px rgba(37,99,235,.45);
    transition:transform .2s var(--ease),box-shadow .2s var(--ease);
  }
  .cta:hover{transform:translateY(-2px);}
  .cta:active{transform:scale(.97);}

  .dim{opacity:0;transition:opacity 1.1s var(--ease);}
  .dim.out{opacity:0;pointer-events:none;}

  /* ---------- Desk scene ---------- */
  .desk-wrap{
    position:relative;opacity:0;transform:translateY(8px);
    transition:opacity .6s var(--ease),transform .6s var(--ease);
    margin-bottom:26px;
  }
  .desk-wrap.shown{opacity:1;transform:translateY(0);}
  .desk{
    background:var(--card);border:1px solid var(--border);border-radius:24px;
    padding:20px;box-shadow:var(--shadow-elevated);position:relative;
  }

  .coverage-panel{
    position:relative;height:76px;border-radius:16px;border:1.5px dashed var(--border);
    display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;padding:8px;
    margin-bottom:12px;overflow:hidden;transition:border-color .4s var(--ease),background .4s var(--ease);
  }
  .coverage-panel.awake{border-style:solid;background:rgba(37,99,235,.03);}
  .pin{
    display:flex;align-items:center;gap:4px;background:#EFF4FF;color:var(--primary);
    border-radius:999px;padding:5px 10px;font-size:11px;font-weight:700;
    transform:scale(.4);opacity:0;transition:transform .45s var(--ease),opacity .45s var(--ease);
  }
  .pin.landed{transform:scale(1);opacity:1;}
  .pin::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--primary);}
  .coverage-empty{color:var(--muted-soft);font-size:12px;}

  .desk-row{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:12px;}
  .obj{
    position:relative;height:68px;border-radius:16px;border:1.5px dashed var(--border);
    display:flex;align-items:center;justify-content:center;
    transition:border-color .4s var(--ease),background .4s var(--ease),transform .1s;
  }
  .obj.awake{border-style:solid;background:#F8FAFB;}
  .obj svg{width:22px;height:22px;color:var(--muted-soft);transition:color .4s var(--ease);}
  .obj.awake svg{color:var(--primary);}
  .obj-pop{transform:scale(1);animation:objPop .5s var(--ease);}
  @keyframes objPop{0%{transform:scale(.4) translateY(6px);}55%{transform:scale(1.08) translateY(-2px);}100%{transform:scale(1) translateY(0);}}

  /* notebook ink lines */
  .notebook-body{width:26px;height:32px;border:1.5px solid var(--border);border-radius:3px;background:#fff;
    display:flex;flex-direction:column;justify-content:center;gap:4px;padding:5px;}
  .ink{height:2px;border-radius:2px;background:var(--primary);width:0;transition:width .6s var(--ease);}
  .ink:nth-child(2){background:var(--success);}
  .obj.awake .ink:nth-child(1){width:100%;transition-delay:.05s;}
  .obj.awake .ink:nth-child(2){width:70%;transition-delay:.25s;}

  /* clock */
  .clock-face{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border);position:relative;}
  .clock-arc{position:absolute;inset:0;border-radius:50%;opacity:0;transition:opacity .5s var(--ease);}
  .obj.awake .clock-arc{opacity:1;}
  .clock-hand{position:absolute;left:50%;top:50%;width:1.5px;height:11px;background:var(--primary);
    transform-origin:bottom center;transform:translate(-50%,-100%) rotate(0deg);
    transition:transform .8s var(--ease);}

  /* phone */
  .phone-body{width:16px;height:26px;border-radius:4px;background:var(--muted-soft);transition:background .5s var(--ease),box-shadow .5s var(--ease);}
  .obj.awake .phone-body{background:linear-gradient(155deg,var(--primary),var(--success));}
  .phone-ring{animation:none;}
  .phone-ring.active{animation:ringPulse 2.4s ease-in-out infinite;}
  @keyframes ringPulse{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.35);}50%{box-shadow:0 0 0 9px rgba(37,99,235,0);}}

  .nameplate{
    position:relative;border-radius:16px;border:1.5px dashed var(--border);
    height:46px;display:flex;align-items:center;justify-content:center;gap:8px;
    transition:border-color .4s var(--ease),background .4s var(--ease);
  }
  .nameplate.awake{border-style:solid;background:linear-gradient(135deg,var(--primary),var(--success));}
  .nameplate-text{color:var(--muted-soft);font-size:12px;font-weight:600;transition:color .3s var(--ease);}
  .nameplate.awake .nameplate-text{color:#fff;font-weight:700;letter-spacing:.01em;}
  .status-dot{
    position:absolute;top:-6px;right:14px;width:13px;height:13px;border-radius:50%;
    background:var(--card);border:2px solid var(--muted-soft);transition:all .4s var(--ease);
  }
  .status-dot.ready{border-color:var(--success);background:var(--success);box-shadow:0 0 0 4px rgba(34,197,94,.18);}
  .status-dot.ready::after{
    content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px solid var(--success);
    animation:statusRing 1.6s var(--ease) 1;
  }
  @keyframes statusRing{from{opacity:.9;transform:scale(.6);}to{opacity:0;transform:scale(1.9);}}

  .desk.settling .obj,.desk.settling .nameplate,.desk.settling .coverage-panel{
    animation:settleGlow .9s var(--ease);
  }
  @keyframes settleGlow{
    0%{box-shadow:0 0 0 0 rgba(37,99,235,0);}
    35%{box-shadow:0 0 0 5px rgba(37,99,235,.10);}
    100%{box-shadow:0 0 0 0 rgba(37,99,235,0);}
  }

  /* ---------- Spotlight (travelling attention) ---------- */
  .spotlight{
    position:fixed;top:0;left:0;width:52px;height:52px;border-radius:50%;
    background:radial-gradient(circle,rgba(37,99,235,.55),rgba(34,197,94,.35) 55%,transparent 75%);
    filter:blur(2px);
    opacity:0;pointer-events:none;z-index:400;
    transform:translate(-50%,-50%);
    transition:transform .62s var(--ease),opacity .4s var(--ease);
  }
  .spotlight.on{opacity:1;}
  .spotlight.resting{opacity:.35;width:30px;height:30px;}

  /* ---------- Cards / steps ---------- */
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:22px;
    padding:24px;box-shadow:var(--shadow-elevated);position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;inset:0;opacity:0;pointer-events:none;
    background:radial-gradient(220px circle at 50% 0%,rgba(37,99,235,.08),transparent 70%);
  }
  .card.spot::before{opacity:1;}

  .voice{
    display:flex;gap:10px;align-items:flex-start;margin-bottom:16px;
  }
  .voice-dot{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--success));
    margin-top:7px;flex-shrink:0;}
  .voice p{margin:0;font-size:16px;font-weight:600;line-height:1.45;letter-spacing:-.01em;}
  .voice .sub{margin-top:6px;font-size:13px;font-weight:500;color:var(--muted);line-height:1.5;}

  input[type=text],input[type=email],input[type=password],input[type=time]{
    width:100%;height:52px;border-radius:16px;border:1.75px solid var(--border);
    padding:0 16px;font-size:15px;font-weight:600;color:var(--foreground);
    outline:none;transition:border-color .25s var(--ease),box-shadow .25s var(--ease);
    background:var(--background);
  }
  input::placeholder{color:var(--muted-soft);font-weight:400;}
  input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(37,99,235,.08);background:#fff;}

  .field{margin-bottom:12px;}
  .label{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0 0 6px 2px;}

  .btn{
    appearance:none;border:none;cursor:pointer;border-radius:999px;font-weight:700;font-size:14px;
    padding:13px 22px;transition:transform .15s var(--ease),opacity .2s;
  }
  .btn:active{transform:scale(.965);}
  .btn-primary{background:var(--primary);color:#fff;box-shadow:0 8px 20px -8px rgba(37,99,235,.5);}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;}
  .btn-primary:disabled:active{transform:none;}
  .btn-ghost{background:transparent;color:var(--muted);border:1.5px solid var(--border);}
  .btn-ghost:hover{border-color:var(--muted-soft);}
  .btn-gradient{background:linear-gradient(120deg,var(--primary),var(--success));color:#fff;box-shadow:0 10px 26px -10px rgba(37,99,235,.5);}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}

  .rename{font-size:12.5px;color:var(--muted);margin-top:2px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;}
  .rename:hover{color:var(--primary);}
  .rename-input{display:none;margin-top:8px;}
  .rename-input.open{display:block;}

  .trade-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
  .trade-card{
    display:flex;flex-direction:column;align-items:center;gap:8px;padding:15px 8px;
    border-radius:16px;border:1.75px solid var(--border);background:var(--background);cursor:pointer;
    transition:border-color .2s,transform .15s;
  }
  .trade-card:hover{transform:translateY(-2px);border-color:var(--muted-soft);}
  .trade-card.picked{border-color:var(--primary);background:#EFF4FF;}
  .trade-card svg{width:19px;height:19px;color:var(--primary);}
  .trade-card span{font-size:12px;font-weight:700;}

  .chip-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px;}
  .chip{background:#EFF4FF;color:var(--primary);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:700;
    display:flex;align-items:center;gap:6px;}
  .chip button{border:none;background:none;color:var(--primary);cursor:pointer;font-size:13px;opacity:.6;padding:0;}

  .examples{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;}
  .example-chip{
    font-size:12px;font-weight:600;color:var(--muted);background:var(--background);
    border:1px solid var(--border);border-radius:999px;padding:7px 12px;cursor:pointer;
    transition:border-color .2s,color .2s;
  }
  .example-chip:hover{border-color:var(--primary);color:var(--primary);}

  .pace-dot{display:flex;justify-content:center;padding:22px 0;}
  .pace-dot span{width:7px;height:7px;border-radius:50%;background:var(--primary);animation:pulseDot 1.1s ease-in-out infinite;}
  @keyframes pulseDot{0%,100%{opacity:.3;}50%{opacity:1;}}

  .step{animation:stepIn .38s var(--ease);}
  @keyframes stepIn{from{opacity:0;transform:translateY(9px);}to{opacity:1;transform:translateY(0);}}

  /* exchange (final invitation) */
  .exchange{margin-top:14px;display:flex;flex-direction:column;gap:8px;}
  .bubble{max-width:82%;padding:11px 15px;border-radius:16px;font-size:13.5px;font-weight:500;line-height:1.45;
    opacity:0;transform:translateY(6px);animation:bubbleIn .4s var(--ease) forwards;}
  @keyframes bubbleIn{to{opacity:1;transform:translateY(0);}}
  .bubble.them{align-self:flex-start;background:var(--background);border:1px solid var(--border);border-bottom-left-radius:4px;}
  .bubble.us{align-self:flex-end;background:linear-gradient(120deg,var(--primary),var(--success));color:#fff;border-bottom-right-radius:4px;}

  .fine{font-size:11.5px;color:var(--muted-soft);margin-top:14px;text-align:center;}

  @media (max-width:400px){
    .stage{padding-top:52px;}
    .trade-grid{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>

<div class="version-label">Experience Prototype — Draft 2 · Not production code</div>
<button class="start-over" id="startOver">Start over</button>
<div class="spotlight" id="spotlight"></div>

<div class="stage">

  <!-- THRESHOLD -->
  <div class="threshold dim" id="threshold" style="opacity:1;">
    <h1>Meet your receptionist</h1>
    <button class="cta" id="beginBtn">Meet your receptionist</button>
  </div>

  <!-- DESK -->
  <div class="desk-wrap" id="deskWrap">
    <div class="desk" id="desk">
      <div class="coverage-panel" id="objCoverage">
        <span class="coverage-empty">Coverage</span>
      </div>
      <div class="desk-row">
        <div class="obj" id="objTool" title="Trade">
          <svg id="toolIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg>
        </div>
        <div class="obj" id="objNotebook" title="Knowledge">
          <div class="notebook-body"><span class="ink"></span><span class="ink"></span></div>
        </div>
        <div class="obj" id="objClock" title="Hours">
          <div class="clock-face">
            <div class="clock-arc" id="clockArc"></div>
            <div class="clock-hand" id="clockHand"></div>
          </div>
        </div>
        <div class="obj" id="objPhone" title="Conversations">
          <div class="phone-body" id="phoneBody"></div>
        </div>
      </div>
      <div class="nameplate" id="objNameplate">
        <span class="nameplate-text" id="nameplateText">Not yet named</span>
        <div class="status-dot" id="statusDot"></div>
      </div>
    </div>
  </div>

  <!-- STEP HOST -->
  <div id="stepHost"></div>

</div>

<script>
(function(){
  "use strict";

  var els = {
    threshold: document.getElementById('threshold'),
    deskWrap: document.getElementById('deskWrap'),
    desk: document.getElementById('desk'),
    stepHost: document.getElementById('stepHost'),
    spotlight: document.getElementById('spotlight'),
    startOver: document.getElementById('startOver'),
    objCoverage: document.getElementById('objCoverage'),
    objTool: document.getElementById('objTool'),
    toolIcon: document.getElementById('toolIcon'),
    objNotebook: document.getElementById('objNotebook'),
    objClock: document.getElementById('objClock'),
    clockArc: document.getElementById('clockArc'),
    clockHand: document.getElementById('clockHand'),
    objPhone: document.getElementById('objPhone'),
    phoneBody: document.getElementById('phoneBody'),
    objNameplate: document.getElementById('objNameplate'),
    nameplateText: document.getElementById('nameplateText'),
    statusDot: document.getElementById('statusDot')
  };

  var TRADE_ICONS = {
    plumbing: '<path d="M14 7l3-3 4 4-3 3M17 8l-9 9-4-4 9-9M6 18l-3 3M13 6l1.5 1.5"></path>',
    electrical: '<path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"></path>',
    painting: '<path d="M4 21v-4a2 2 0 012-2h6a2 2 0 012 2v4M6 15V8a2 2 0 012-2h4M9 6V3h6v3"></path>',
    building: '<path d="M4 21h16M6 21V9l6-4 6 4v12M10 21v-5h4v5"></path>',
    roofing: '<path d="M3 12 12 4l9 8M5 11v9h14v-9"></path>'
  };
  var TRADE_LABEL = { plumbing:"Plumber", electrical:"Electrician", painting:"Painter", building:"Builder", roofing:"Roofer" };

  var state = {
    name: "Robin",
    business: "",
    trade: null,
    areas: [],
    opening: "08:00",
    closing: "17:30",
    memory: ""
  };

  /* ---------------- Spotlight (travelling attention) ---------------- */
  function homePos(){
    var r = els.objNameplate.getBoundingClientRect();
    return { x: r.left + r.width/2, y: r.top + r.height/2 };
  }
  function moveSpotlightTo(target, cb){
    var r = target.getBoundingClientRect();
    var x = r.left + r.width/2, y = r.top + r.height/2;
    els.spotlight.classList.remove('resting');
    els.spotlight.classList.add('on');
    els.spotlight.style.transform = 'translate('+x+'px,'+y+'px) translate(-50%,-50%)';
    setTimeout(function(){
      if (cb) cb();
      setTimeout(function(){
        var h = homePos();
        els.spotlight.style.transform = 'translate('+h.x+'px,'+h.y+'px) translate(-50%,-50%)';
        els.spotlight.classList.add('resting');
      }, 260);
    }, 640);
  }
  function restSpotlight(){
    var h = homePos();
    els.spotlight.style.transform = 'translate('+h.x+'px,'+h.y+'px) translate(-50%,-50%)';
    els.spotlight.classList.add('on','resting');
  }

  function wake(el, cb){
    el.classList.add('awake');
    el.classList.remove('obj-pop');
    void el.offsetWidth;
    el.classList.add('obj-pop');
    if (cb) setTimeout(cb, 480);
  }

  /* ---------------- Step machine ---------------- */
  var advancing = false;
  function render(html, after){
    els.stepHost.innerHTML = '<div class="step">' + html + '</div>';
    if (after) after();
  }
  function pending(after, ms){
    els.stepHost.innerHTML = '<div class="step pace-dot"><span></span></div>';
    setTimeout(function(){ advancing = false; after(); }, ms || 780);
  }

  function begin(){
    els.threshold.classList.add('out');
    setTimeout(function(){
      els.threshold.style.display = 'none';
      els.deskWrap.classList.add('shown');
      els.startOver.classList.add('visible');
      restSpotlight();
      stepGreeting();
    }, 520);
  }

  function stepGreeting(){
    render(
      '<div class="card"><div class="voice"><div class="voice-dot"></div><div>' +
        '<p>I’m <span id="rname">'+state.name+'</span>. I’ll be the one answering your customers.</p>' +
        '<div class="rename" id="renameToggle">Not '+state.name+'? Tap to change</div>' +
        '<div class="rename-input" id="renameBox">' +
          '<input type="text" id="renameField" maxlength="24" placeholder="Choose a name" />' +
        '</div>' +
      '</div></div>' +
      '<div class="btn-row"><button class="btn btn-primary" id="greetContinue">Continue</button></div></div>',
      function(){
        document.getElementById('renameToggle').onclick = function(){
          document.getElementById('renameBox').classList.add('open');
          var f = document.getElementById('renameField');
          f.value = state.name; f.focus();
          f.onkeydown = function(e){
            if (e.key === 'Enter' && f.value.trim().length > 0){
              state.name = f.value.trim();
              document.getElementById('rname').textContent = state.name;
              document.getElementById('renameToggle').textContent = 'Not '+state.name+'? Tap to change';
              document.getElementById('renameBox').classList.remove('open');
            }
          };
        };
        document.getElementById('greetContinue').onclick = function(){
          if (advancing) return; advancing = true;
          pending(stepBusinessName, 500);
        };
      }
    );
  }

  function stepBusinessName(){
    render(
      '<div class="card spot"><div class="voice"><div class="voice-dot"></div><p>What’s your business called?</p></div>' +
      '<div class="field"><input type="text" id="bizInput" placeholder="Acme Services" maxlength="80" autofocus /></div>' +
      '<div class="btn-row"><button class="btn btn-primary" id="bizGo" disabled>Tell them</button></div></div>',
      function(){
        var input = document.getElementById('bizInput'), go = document.getElementById('bizGo');
        input.addEventListener('input', function(){ go.disabled = input.value.trim().length < 2; });
        input.addEventListener('keydown', function(e){ if (e.key === 'Enter' && !go.disabled) go.click(); });
        go.onclick = function(){
          if (advancing) return; advancing = true;
          state.business = input.value.trim();
          moveSpotlightTo(els.objNameplate, function(){
            els.nameplateText.textContent = state.business;
            wake(els.objNameplate);
          });
          pending(stepTrade, 900);
        };
      }
    );
  }

  function stepTrade(){
    var trades = ['plumbing','electrical','painting','building','roofing'];
    var cards = trades.map(function(t){
      return '<div class="trade-card" data-trade="'+t+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+TRADE_ICONS[t]+'</svg><span>'+TRADE_LABEL[t]+'</span></div>';
    }).join('');
    render(
      '<div class="card spot"><div class="voice"><div class="voice-dot"></div><p>What’s your trade?</p></div>' +
      '<div class="trade-grid">'+cards+'</div></div>',
      function(){
        var cardsEls = els.stepHost.querySelectorAll('.trade-card');
        cardsEls.forEach(function(c){
          c.onclick = function(){
            if (advancing) return; advancing = true;
            state.trade = c.getAttribute('data-trade');
            moveSpotlightTo(els.objTool, function(){
              els.toolIcon.innerHTML = TRADE_ICONS[state.trade];
              wake(els.objTool);
            });
            pending(stepCoverage, 700);
          };
        });
      }
    );
  }

  function renderChips(){
    return state.areas.map(function(a,i){
      return '<span class="chip">'+a+'<button data-i="'+i+'">✕</button></span>';
    }).join('');
  }

  function stepCoverage(){
    render(
      '<div class="card spot"><div class="voice"><div class="voice-dot"></div><p>Where do you work?</p>' +
        '<div class="sub">Add every town or area you cover.</div></div>' +
      '<div class="chip-row" id="chipRow">'+renderChips()+'</div>' +
      '<div class="field"><input type="text" id="areaInput" placeholder="Add a town, postcode, or area" /></div>' +
      '<div class="btn-row"><button class="btn btn-primary" id="coverGo" '+(state.areas.length?'':'disabled')+'>That’s everywhere I cover</button></div></div>',
      function(){
        var input = document.getElementById('areaInput'), go = document.getElementById('coverGo');
        function addPin(name){
          // The pin lands immediately — it's the real data. The spotlight
          // visit is a decorative signal on top and must never gate it,
          // or typing two areas in quick succession drops the second one.
          var empty = els.objCoverage.querySelector('.coverage-empty');
          if (empty) empty.remove();
          els.objCoverage.classList.add('awake');
          var pin = document.createElement('span');
          pin.className = 'pin'; pin.textContent = name;
          els.objCoverage.appendChild(pin);
          requestAnimationFrame(function(){ pin.classList.add('landed'); });
          moveSpotlightTo(els.objCoverage, function(){});
        }
        input.addEventListener('keydown', function(e){
          if (e.key === 'Enter' && input.value.trim().length > 0){
            var v = input.value.trim();
            state.areas.push(v);
            document.getElementById('chipRow').innerHTML = renderChips();
            wireChipRemovals();
            input.value = '';
            go.disabled = false;
            addPin(v);
          }
        });
        function wireChipRemovals(){
          els.stepHost.querySelectorAll('#chipRow button').forEach(function(b){
            b.onclick = function(){
              state.areas.splice(parseInt(b.getAttribute('data-i'),10),1);
              document.getElementById('chipRow').innerHTML = renderChips();
              wireChipRemovals();
              go.disabled = state.areas.length === 0;
            };
          });
        }
        wireChipRemovals();
        go.onclick = function(){
          if (advancing || state.areas.length === 0) return; advancing = true;
          pending(stepHours, 900);
        };
      }
    );
  }

  function clockAngle(t){
    var parts = t.split(':'); var h = parseInt(parts[0],10), m = parseInt(parts[1],10);
    return ((h % 12) + m/60) / 12 * 360;
  }

  function stepHours(){
    var label = TRADE_LABEL[state.trade] ? TRADE_LABEL[state.trade].toLowerCase()+'s' : 'businesses like yours';
    render(
      '<div class="card spot"><div class="voice"><div class="voice-dot"></div>' +
        '<p>Most '+label+' I work with run weekdays, eight till half five. I’ll start you there.</p>' +
        '<div class="sub">You can adjust this any time.</div></div>' +
      '<div class="btn-row">' +
        '<button class="btn btn-primary" id="hoursGood">That’s right</button>' +
        '<button class="btn btn-ghost" id="hoursAdjust">Let me adjust it</button>' +
      '</div></div>',
      function(){
        document.getElementById('hoursGood').onclick = function(){
          if (advancing) return; advancing = true;
          commitHours();
        };
        document.getElementById('hoursAdjust').onclick = function(){
          render(
            '<div class="card spot"><div class="voice"><div class="voice-dot"></div><p>What hours should I use?</p></div>' +
            '<div style="display:flex;gap:10px;align-items:flex-end;margin-bottom:14px;">' +
              '<label style="flex:1"><div class="label">Opens</div><input type="time" id="openIn" value="'+state.opening+'" /></label>' +
              '<label style="flex:1"><div class="label">Closes</div><input type="time" id="closeIn" value="'+state.closing+'" /></label>' +
            '</div>' +
            '<div class="btn-row"><button class="btn btn-primary" id="hoursConfirm">Use these hours</button></div></div>',
            function(){
              document.getElementById('hoursConfirm').onclick = function(){
                if (advancing) return; advancing = true;
                state.opening = document.getElementById('openIn').value || state.opening;
                state.closing = document.getElementById('closeIn').value || state.closing;
                commitHours();
              };
            }
          );
        };
      }
    );
  }

  function commitHours(){
    moveSpotlightTo(els.objClock, function(){
      var startDeg = clockAngle(state.opening), endDeg = clockAngle(state.closing);
      els.clockArc.style.background = 'conic-gradient(from '+(startDeg-90)+'deg, rgba(34,197,94,.28) 0deg, rgba(34,197,94,.28) '+Math.max(0,endDeg-startDeg)+'deg, transparent 0deg)';
      els.clockHand.style.transform = 'translate(-50%,-100%) rotate('+endDeg+'deg)';
      wake(els.objClock);
    });
    pending(stepKnowledge, 900);
  }

  var EXAMPLES = [
    'We always wear shoe covers',
    'Family business, three generations',
    'Guaranteed for five years'
  ];

  function stepKnowledge(){
    render(
      '<div class="card spot"><div class="voice"><div class="voice-dot"></div>' +
        '<p>Tell me one thing worth mentioning to a customer.</p>' +
        '<div class="sub">So I can bring it up naturally when it’s relevant.</div></div>' +
      '<div class="field"><input type="text" id="memInput" placeholder="e.g. We always wear shoe covers" maxlength="140" /></div>' +
      '<div class="examples">'+EXAMPLES.map(function(e){return '<span class="example-chip" data-v="'+e+'">'+e+'</span>';}).join('')+'</div>' +
      '<div class="btn-row" style="margin-top:16px;"><button class="btn btn-primary" id="memGo" disabled>Remember that</button></div></div>',
      function(){
        var input = document.getElementById('memInput'), go = document.getElementById('memGo');
        input.addEventListener('input', function(){ go.disabled = input.value.trim().length === 0; });
        input.addEventListener('keydown', function(e){ if (e.key === 'Enter' && !go.disabled) go.click(); });
        els.stepHost.querySelectorAll('.example-chip').forEach(function(chip){
          chip.onclick = function(){ input.value = chip.getAttribute('data-v'); go.disabled = false; input.focus(); };
        });
        go.onclick = function(){
          if (advancing) return; advancing = true;
          state.memory = input.value.trim();
          moveSpotlightTo(els.objNotebook, function(){ wake(els.objNotebook); });
          pending(stepAccount, 900);
        };
      }
    );
  }

  function stepAccount(){
    render(
      '<div class="card spot"><div class="voice"><div class="voice-dot"></div>' +
        '<p>One more thing — this is what turns me on.</p>' +
        '<div class="sub">Create your login and I’ll start answering for real.</div></div>' +
      '<div class="field"><div class="label">Email</div><input type="email" id="emailIn" placeholder="you@yourbusiness.com" /></div>' +
      '<div class="field"><div class="label">Password</div><input type="password" id="passIn" placeholder="At least 8 characters" /></div>' +
      '<div class="btn-row"><button class="btn btn-gradient" id="accountGo">Bring me online</button></div></div>',
      function(){
        document.getElementById('accountGo').onclick = function(){
          if (advancing) return; advancing = true;
          pending(stepSettle, 500);
        };
      }
    );
  }

  function stepSettle(){
    els.stepHost.innerHTML = '';
    els.desk.classList.add('settling');
    els.statusDot.classList.add('ready');
    moveSpotlightTo(els.objPhone, function(){
      wake(els.objPhone);
      els.phoneBody.parentElement.classList.add('phone-ring','active');
    });
    setTimeout(stepArrival, 1200);
  }

  function stepArrival(){
    els.desk.classList.remove('settling');
    render(
      '<div class="card"><div class="voice"><div class="voice-dot"></div>' +
        '<p>I’m ready. Send me something real and I’ll show you how I’d answer.</p></div>' +
      '<div class="field"><input type="text" id="testMsg" placeholder="Type a message like a customer would" /></div>' +
      '<div class="btn-row"><button class="btn btn-primary" id="testGo" disabled>Send it</button></div>' +
      '<div class="exchange" id="exchange"></div></div>',
      function(){
        var input = document.getElementById('testMsg'), go = document.getElementById('testGo');
        input.addEventListener('input', function(){ go.disabled = input.value.trim().length === 0; });
        input.addEventListener('keydown', function(e){ if (e.key === 'Enter' && !go.disabled) go.click(); });
        go.onclick = function(){
          var v = input.value.trim(); if (!v) return;
          var ex = document.getElementById('exchange');
          var them = document.createElement('div'); them.className = 'bubble them'; them.textContent = v;
          ex.appendChild(them);
          input.value = ''; go.disabled = true; input.disabled = true;
          setTimeout(function(){
            var typing = document.createElement('div'); typing.className='bubble them'; typing.style.opacity='.6';
            typing.textContent = '…'; ex.appendChild(typing);
            setTimeout(function(){
              typing.remove();
              var us = document.createElement('div'); us.className = 'bubble us';
              us.textContent = 'Thanks for reaching out' + (state.business ? ' to ' + state.business : '') + ' — I can help with that. What’s the address, and is this something that needs sorting today?';
              ex.appendChild(us);
              input.disabled = false;
            }, 900);
          }, 500);
        };
        var fine = document.createElement('div');
        fine.className = 'fine';
        fine.textContent = 'You’re standing in the same place you’ll come back to every day — nothing else to set up.';
        els.stepHost.querySelector('.card').appendChild(fine);
      }
    );
  }

  function reset(){
    state = { name:"Robin", business:"", trade:null, areas:[], opening:"08:00", closing:"17:30", memory:"" };
    advancing = false;
    els.threshold.style.display = '';
    els.threshold.classList.remove('out');
    els.deskWrap.classList.remove('shown');
    els.startOver.classList.remove('visible');
    els.stepHost.innerHTML = '';
    els.spotlight.classList.remove('on','resting');
    [els.objCoverage,els.objTool,els.objNotebook,els.objClock,els.objPhone,els.objNameplate].forEach(function(o){
      o.classList.remove('awake','obj-pop');
    });
    els.objCoverage.innerHTML = '<span class="coverage-empty">Coverage</span>';
    els.toolIcon.innerHTML = TRADE_ICONS.plumbing.replace(/plumbing/,'');
    els.toolIcon.innerHTML = '<circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path>';
    els.nameplateText.textContent = 'Not yet named';
    els.statusDot.classList.remove('ready');
    els.objPhone.classList.remove('phone-ring','active');
  }

  document.getElementById('beginBtn').addEventListener('click', begin);
  els.startOver.addEventListener('click', reset);
})();
</script>
</body>
</html>
